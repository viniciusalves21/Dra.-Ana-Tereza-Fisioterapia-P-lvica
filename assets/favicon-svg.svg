<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo Terracota Oficial da Identidade Visual -->
  <rect width="64" height="64" rx="14" fill="#B85D43"/>

  <!-- Pelve idêntica ao símbolo do Logotipo da Dra. Ana Tereza -->
  <g fill="none" stroke="#FAF6F0" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Asas Ilíacas Externas (Silhueta delicada com topo arredondado) -->
    <path d="M 29.5 21 C 26 17, 16 16.5, 13 23 C 10.5 28.5, 12.5 35, 16.5 37.5 C 18 39, 17.5 44, 20 48 C 22.5 52, 27 51.5, 29.5 47 C 30.5 48.5, 33.5 48.5, 34.5 47 C 37 51.5, 41.5 52, 44 48 C 46.5 44, 46 39, 47.5 37.5 C 51.5 35, 53.5 28.5, 51 23 C 48 16.5, 38 17, 34.5 21" stroke-width="2.3"/>
    
    <!-- Linhas internas das Asas Ilíacas (Traço de contorno interno da logo) -->
    <path d="M 16 24 C 18 20.5, 23 20.5, 27 23.5" stroke-width="1.6"/>
    <path d="M 48 24 C 46 20.5, 41 20.5, 37 23.5" stroke-width="1.6"/>
    <path d="M 21.5 37 C 18 36, 15 31, 15 26" stroke-width="1.5"/>
    <path d="M 42.5 37 C 46 36, 49 31, 49 26" stroke-width="1.5"/>

    <!-- Vértebra Superior (Topo da Coluna/Sacro) -->
    <path d="M 29 19 C 30.5 17.8, 33.5 17.8, 35 19" stroke-width="1.7"/>
    <path d="M 28 20.5 L 36 20.5" stroke-width="1.6"/>

    <!-- Sacro Central com Frisos Ondulados da Logo -->
    <path d="M 26.5 23.5 C 28.5 22, 30 24.5, 32 23 C 34 24.5, 35.5 22, 37.5 23.5 C 36.5 29, 34.5 34.5, 32 38.5 C 29.5 34.5, 27.5 29, 26.5 23.5 Z" stroke-width="1.8"/>
    
    <!-- Frisos Internos do Sacro -->
    <path d="M 29.5 26.5 C 30.8 27.8, 33.2 27.8, 34.5 26.5" stroke-width="1.4"/>
    <path d="M 30 29.5 C 31 30.5, 33 30.5, 34 29.5" stroke-width="1.4"/>
    <path d="M 30.5 32.5 C 31.2 33.3, 32.8 33.3, 33.5 32.5" stroke-width="1.4"/>

    <!-- Forames Obturados Inferiores -->
    <path d="M 23 44 C 23 40.5, 26.5 40.5, 27 43.5 C 27 46.5, 23.8 47.5, 23 44 Z" stroke-width="1.7"/>
    <path d="M 41 44 C 41 40.5, 37.5 40.5, 37 43.5 C 37 46.5, 40.2 47.5, 41 44 Z" stroke-width="1.7"/>

    <!-- Coraçãozinho Central na Sínfise Púbica -->
    <path d="M 32 45 C 31 43.8, 29.5 44.2, 29.8 45.6 C 30.2 46.9, 32 48.3, 32 48.3 C 32 48.3, 33.8 46.9, 34.2 45.6 C 34.5 44.2, 33 43.8, 32 45 Z" fill="#FAF6F0" stroke="none"/>
  </g>
</svg>
